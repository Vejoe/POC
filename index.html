<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>设备信息 · 指纹面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f5f7fc 0%, #e9ecf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 20px;
        }

        .device-card {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: #ffffffec;
            box-shadow: 0 20px 40px -8px rgba(18, 25, 45, 0.12), 0 8px 16px -6px rgba(0, 0, 0, 0.05);
            border-radius: 36px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 28px 30px 34px;
            transition: all 0.2s ease;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            border-bottom: 2px solid rgba(75, 95, 145, 0.12);
            padding-bottom: 18px;
        }

        .header-icon {
            font-size: 30px;
            line-height: 1;
        }

        .header h1 {
            font-weight: 620;
            font-size: 1.9rem;
            letter-spacing: -0.02em;
            color: #1a2639;
            margin: 0;
        }

        .header .badge {
            margin-left: auto;
            background: #1e2b3f;
            color: #d9e2ef;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            background: rgba(22, 34, 55, 0.08);
            color: #1f2a41;
            border: 1px solid #cdd6e4;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px 20px;
            margin-bottom: 24px;
        }

        .info-item {
            background: #ffffffd6;
            border-radius: 22px;
            padding: 14px 18px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: inset 0 1px 3px #ffffff, 0 4px 8px -4px rgba(0, 10, 30, 0.08);
            border: 1px solid #ffffff;
            transition: transform 0.1s;
        }

        .info-item:hover {
            background: #ffffff;
            border-color: #cbd5e3;
        }

        .label {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4a5b7c;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .value {
            font-weight: 580;
            font-size: 1.05rem;
            color: #0b1a2b;
            word-break: break-word;
            line-height: 1.4;
            font-family: 'SF Mono', 'Menlo', 'Monaco', 'Cascadia Code', 'Consolas', monospace;
            background: #fafcff;
            padding: 4px 0;
            border-radius: 12px;
        }

        .value.small-mono {
            font-size: 0.85rem;
            word-break: break-all;
        }
        
        /* base64 区域单独样式，更紧凑 */
        .base64-value {
            font-family: 'SF Mono', 'Menlo', 'Monaco', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.75rem;
            background: #f1f4fa;
            padding: 8px 10px;
            border-radius: 16px;
            word-break: break-all;
            color: #1c3b5c;
            line-height: 1.45;
            margin-top: 4px;
            border: 1px solid #e2e8f2;
        }

        .canvas-section {
            margin-top: 12px;
            background: #1e293b0c;
            border-radius: 24px;
            padding: 18px 20px;
            border: 1px dashed #9aabc0;
        }

        .fingerprint-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 24px;
        }

        .fingerprint-row .label {
            min-width: 100px;
            font-size: 0.8rem;
            margin-bottom: 0;
        }

        .canvas-hash {
            font-family: 'SF Mono', 'Menlo', monospace;
            background: #0f172a12;
            padding: 8px 14px;
            border-radius: 60px;
            font-size: 0.85rem;
            color: #143650;
            word-break: break-all;
            backdrop-filter: blur(2px);
            border: 1px solid #ced8e6;
        }

        .note-line {
            color: #436684;
            font-size: 0.85rem;
            margin-top: 14px;
            padding-left: 8px;
            opacity: 0.8;
        }

        .refresh-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            border: 1.5px solid #bfcfe0;
            color: #1f344b;
            font-weight: 550;
            padding: 12px 24px;
            border-radius: 48px;
            font-size: 0.95rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            margin-top: 10px;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .refresh-btn:hover {
            background: #eef3fe;
            border-color: #7c95b3;
            box-shadow: 0 6px 12px -6px #334e6e33;
            transform: scale(1.01);
        }

        .footer-note {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .error-message {
            color: #b13e3e;
            background: #ffe8e8;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="device-card">
        <div class="header">
            <span class="header-icon">🖥️📱</span>
            <h1>设备指纹 · 信息</h1>
            <span class="badge" id="liveBadge">实时采集</span>
        </div>

        <!-- 主要信息网格 —— 动态绑定展示 -->
        <div class="info-grid" id="infoGrid">
            <!-- 通过js动态填充，保证结构统一 -->
        </div>

        <!-- 高级指纹区域： canvas / webgl -->
        <div class="canvas-section">
            <div class="fingerprint-row">
                <span class="label">🎨 Canvas 指纹</span>
                <span class="canvas-hash" id="canvasFingerprint">计算中...</span>
            </div>
            <div class="fingerprint-row" style="margin-top: 14px;">
                <span class="label">🧬 WebGL 指纹</span>
                <span class="canvas-hash" id="webglFingerprint">计算中...</span>
            </div>
            <div class="note-line">
                ⚡ 基于 Canvas / WebGL 渲染器哈希 · 用于增强识别
            </div>
        </div>

        <div class="footer-note">
            <button class="refresh-btn" id="refreshButton">
                <span>⟳</span> 刷新设备信息
            </button>
        </div>
        <div id="errorMsg" class="error-message" style="display: none; margin-top: 10px;"></div>
    </div>

    <script>
        (function(){
            "use strict";

            // ---------- 简化的操作系统识别：只返回 'aos' (安卓), 'ios' (苹果手机/ipad), 'NOT PHONE' ----------
            function getSimplifiedOS() {
                const ua = navigator.userAgent.toLowerCase();
                // 检测安卓设备 (Android 手机/平板)
                if (/android/.test(ua)) {
                    return 'aos';
                }
                // 检测苹果设备: iPhone, iPad, iPod touch (iPad 也归为 ios)
                if (/iphone|ipad|ipod/.test(ua)) {
                    return 'ios';
                }
                // 其余情况：PC、Linux、其他移动端(如鸿蒙手机可单独扩展但按需求归为 NOT PHONE)
                // 注意: 如果希望 Windows 手机之类也识别为手机，但这里只区分严格安卓/苹果，其余全部 "NOT PHONE"
                return 'NOT PHONE';
            }

            // ---------- 辅助函数：获取时区字符串 (GMT+/-HH:MM) ----------
            function getTimezoneString() {
                const offset = -new Date().getTimezoneOffset() / 60;
                const hours = Math.floor(Math.abs(offset));
                const minutes = (Math.abs(offset) % 1) * 60;
                const sign = offset >= 0 ? '+' : '-';
                return `GMT${sign}${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            }

            // ---------- 获取基础设备数据 (pixel, pixelRatio, os简化版, timezone, language, 备用) ----------
            // 额外保留原始分辨率等
            function getBasicDeviceData() {
                const screenWidth = screen.width;
                const screenHeight = screen.height;
                const pixelRatio = window.devicePixelRatio || 1;
                // pixel 展示为 "宽x高" 字符串
                const pixelValue = `${screenWidth}x${screenHeight}`;
                const osSimplified = getSimplifiedOS();
                const timezone = getTimezoneString();
                const language = navigator.language || 'unknown';
                
                return {
                    pixel: pixelValue,
                    pixelRatio: pixelRatio,
                    os: osSimplified,
                    timezone: timezone,
                    language: language
                };
            }

            // ---------- 将指定对象转为 JSON 字符串，然后 Base64 编码 ----------
            function encodeToBase64(obj) {
                try {
                    const jsonStr = JSON.stringify(obj);
                    // btoa 支持 ASCII 字符，可处理 UTF-8 需要先转码
                    // 使用 encodeURIComponent + btoa 稳健处理中文（虽然对象中的值都是英文/数字/冒号等，无害）
                    // 但为保证任何字符，使用 TextEncoder 至 base64 兼容性更好。
                    // 但为了兼容所有浏览器，使用经典的 unescape(encodeURIComponent) 方式
                    const utf8Bytes = unescape(encodeURIComponent(jsonStr));
                    const base64 = btoa(utf8Bytes);
                    return base64;
                } catch (e) {
                    console.warn('Base64编码失败', e);
                    return 'encode_error';
                }
            }

            // ---------- Canvas 指纹 (保持不变，哈希增强) ----------
            async function getCanvasFingerprint() {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    if (!ctx) return 'canvas-unsupported';
                    
                    canvas.width = 240;
                    canvas.height = 60;
                    
                    ctx.textBaseline = 'top';
                    ctx.font = '14px "Arial", system-ui, sans-serif';
                    ctx.textBaseline = 'alphabetic';
                    ctx.fillStyle = '#f5e9d8';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    const gradient = ctx.createLinearGradient(10, 0, 200, 40);
                    gradient.addColorStop(0, '#1e5799');
                    gradient.addColorStop(0.5, '#2989d8');
                    gradient.addColorStop(1, '#7db9e8');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(4, 4, 200, 28);
                    
                    ctx.fillStyle = '#0b1e2e';
                    ctx.font = 'bold 16px "Segoe UI", "Roboto"';
                    ctx.fillText('DEVICE•ID', 20, 34);
                    
                    ctx.font = '12px "Courier New", monospace';
                    ctx.fillStyle = '#3d2b1f';
                    ctx.fillText('屏幕: ' + screen.width + 'x' + screen.height, 18, 50);
                    
                    ctx.beginPath();
                    ctx.arc(190, 24, 12, 0, Math.PI * 2);
                    ctx.fillStyle = '#bc8f8f55';
                    ctx.fill();
                    ctx.strokeStyle = '#402b1b';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                    
                    const dataURL = canvas.toDataURL();
                    let hash = 0;
                    for (let i = 0; i < dataURL.length; i++) {
                        const char = dataURL.charCodeAt(i);
                        hash = ((hash << 5) - hash) + char;
                        hash |= 0;
                    }
                    const hex = (hash >>> 0).toString(16).toUpperCase().padStart(8, '0');
                    return 'canvas:' + hex + '…' + dataURL.slice(-12).replace(/[^a-zA-Z0-9]/g,'');
                } catch (e) {
                    console.warn('canvas出错', e);
                    return 'canvas-error';
                }
            }

            // ---------- WebGL 指纹 (同步) ----------
            function getWebGLFingerprint() {
                try {
                    const canvas = document.createElement('canvas');
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (!gl) return 'webgl-unsupported';
                    
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    let renderer = 'unknown';
                    let vendor = 'unknown';
                    
                    if (debugInfo) {
                        renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || '未知渲染器';
                        vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) || '未知厂商';
                    } else {
                        renderer = gl.getParameter(gl.RENDERER) || 'no-renderer';
                        vendor = gl.getParameter(gl.VENDOR) || 'no-vendor';
                    }
                    
                    const version = gl.getParameter(gl.VERSION);
                    const shadingLanguageVersion = gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
                    const fingerprintStr = `GL:${vendor}|${renderer}|${version}|${shadingLanguageVersion}`;
                    
                    let simpleHash = 0;
                    for (let i=0; i<fingerprintStr.length; i++) {
                        simpleHash = ((simpleHash << 5) - simpleHash) + fingerprintStr.charCodeAt(i);
                        simpleHash |= 0;
                    }
                    const hashPart = (simpleHash >>> 0).toString(16).toUpperCase().slice(0,6);
                    return `webgl:${hashPart} (${renderer.substring(0,24)})`;
                } catch (e) {
                    console.warn('webgl错误', e);
                    return 'webgl-error';
                }
            }

            // ---------- 渲染信息网格（包括UA和 Base64 编码对象） 按照要求:
            // 需要的字段: pixel, pixelRatio, os, timezone, language 用于 Base64
            // 同时必须保留 User Agent 展示，还要展示 Base64 Encode object 那一行。
            // 根据原有风格增加硬件并发等但不是重点，但为了优雅保留额外 system 字段但不影响主要请求。
            function renderInfoGrid(basicData, userAgentRaw, base64EncodedStr, hardwareConcurrency, deviceMemory) {
                const grid = document.getElementById('infoGrid');
                if (!grid) return;
                
                // 准备展示项:
                // 第一行: pixel (分辨率) , pixelRatio (设备像素比)
                // 第二行: os (简化值 aos/ios/NOT PHONE) , timezone
                // 第三行: language , 以及可选 concurrency / memory (展示增强)
                // 第四行: userAgent (完整) 占满两列
                // 第五行: Base64 Encode object (展示 base64 结果，独占两列，内容为编码后的文本)
                
                // 判断是否为移动操作系统背景，做个小标记(icon)
                let osIcon = '';
                if (basicData.os === 'aos') osIcon = '📱';
                else if (basicData.os === 'ios') osIcon = '📱🍎';
                else osIcon = '💻';
                
                const html = `
                    <div class="info-item">
                        <div class="label">📐 pixel</div>
                        <div class="value">${escapeHtml(basicData.pixel)}</div>
                    </div>
                    <div class="info-item">
                        <div class="label">🔍 pixelRatio</div>
                        <div class="value">${escapeHtml(String(basicData.pixelRatio))}</div>
                    </div>
                    <div class="info-item">
                        <div class="label">${osIcon} os</div>
                        <div class="value">${escapeHtml(basicData.os)}</div>
                    </div>
                    <div class="info-item">
                        <div class="label">🕒 timezone</div>
                        <div class="value">${escapeHtml(basicData.timezone)}</div>
                    </div>
                    <div class="info-item">
                        <div class="label">🌐 language</div>
                        <div class="value">${escapeHtml(basicData.language)}</div>
                    </div>
                    <div class="info-item" style="grid-column: span 2;">
                        <div class="label">🌍 User Agent (完整)</div>
                        <div class="value small-mono" style="word-break: break-all;">${escapeHtml(userAgentRaw)}</div>
                    </div>
                    <div class="info-item" style="grid-column: span 2; background: #f8fafd;">
                        <div class="label">🔐 Base64 Encode object</div>
                        <div class="base64-value" style="font-family: monospace;">${escapeHtml(base64EncodedStr)}</div>
                        <div style="font-size: 0.7rem; margin-top: 6px; color: #4b6b8f;">📦 编码对象: { pixel, pixelRatio, os, timezone, language }</div>
                    </div>
                `;
                
                grid.innerHTML = html;
            }
            
            // 防XSS简易函数
            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                    return c;
                });
            }

            // ---------- 收集所有设备信息并更新展示 (包括canvas/webgl的高级部分) ----------
            async function collectAndDisplayAll() {
                const canvasEl = document.getElementById('canvasFingerprint');
                const webglEl = document.getElementById('webglFingerprint');
                const errorMsgDiv = document.getElementById('errorMsg');
                errorMsgDiv.style.display = 'none';
                
                canvasEl.textContent = '计算中...';
                webglEl.textContent = '计算中...';
                
                // 1. 获取简化的基础设备对象（用于base64）
                const basicDevice = getBasicDeviceData();  // { pixel, pixelRatio, os, timezone, language }
                // 2. 获取原始的 userAgent 完整串
                const rawUserAgent = navigator.userAgent;
                // 3. 额外获取硬件并发与内存 (显示用)
                const hardwareConcurrency = navigator.hardwareConcurrency || 'unknown';
                const deviceMemory = navigator.deviceMemory || 'unknown';
                
                // 4. 根据 basicDevice 对象生成 Base64 编码字符串
                const base64Encoded = encodeToBase64(basicDevice);
                
                // 5. 立即渲染网格（基础信息+UA+Base64结果）
                renderInfoGrid(basicDevice, rawUserAgent, base64Encoded, hardwareConcurrency, deviceMemory);
                
                // 6. 高级指纹获取 (canvas异步 + webgl同步)
                let webglResult = '获取失败';
                try {
                    webglResult = getWebGLFingerprint();
                    webglEl.textContent = webglResult;
                } catch (e) {
                    webglEl.textContent = 'webgl异常';
                }
                
                try {
                    const canvasResult = await getCanvasFingerprint();
                    canvasEl.textContent = canvasResult;
                } catch (e) {
                    canvasEl.textContent = 'canvas指纹错误';
                    errorMsgDiv.style.display = 'block';
                    errorMsgDiv.textContent = '⚠️ Canvas指纹生成失败，但设备信息正常展示';
                }
                
                // 更新徽章时间
                const badge = document.getElementById('liveBadge');
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second:'2-digit' });
                badge.textContent = `更新 ${timeStr}`;
            }
            
            // ---------- 刷新全部 （保持与刷新按钮绑定）----------
            async function refreshAll() {
                await collectAndDisplayAll();
            }
            
            // ---------- 初始化页面 ----------
            window.addEventListener('DOMContentLoaded', async () => {
                await refreshAll();
                const refreshBtn = document.getElementById('refreshButton');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        refreshAll();
                    });
                }
            });
            
            // 可选：处理页面resize时不需要重新采集指纹，但无伤大雅
        })();
    </script>
</body>
</html>
